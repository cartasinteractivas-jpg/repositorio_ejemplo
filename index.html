<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
    <style>
        /* --- ESTILOS (SIN CAMBIOS ) --- */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333; text-align: center; }
        .container { padding: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <p>Cargando tu destino...</p>
    </div>

    <script>
        // 1. Configuración de Supabase (sin cambios)
        const SUPABASE_URL = 'https://flcxihzwyexgigavztce.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsY3hpaHp3eWV4Z2lnYXZ6dGNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyODI0MzAsImV4cCI6MjA3OTg1ODQzMH0.7Ur3LcihnR6wIEM7QjFxNIe4ci2TmIVVt8ZcvekFSqA';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY );

        // 2. ID del usuario. ¡ESTO ES LO ÚNICO QUE CAMBIARÁS PARA CADA CLIENTE!
        const USUARIO_ID = '00007'; // Ejemplo para el cliente 4

        // 3. Función que se ejecuta al cargar la página
        window.addEventListener('load', async () => {
            try {
                // --- ¡NUEVA LÓGICA DE CONTEO! ---
                // Primero, llamamos a la función para incrementar el contador.
                // No nos importa la respuesta, solo que se ejecute.
                // Usamos '.rpc' para llamar a la función que creamos.
                const { error: rpcError } = await supabase
                    .rpc('increment_visitas', { qr_id_param: USUARIO_ID });

                if (rpcError) {
                    // Si falla el conteo, lo registramos en la consola pero continuamos,
                    // porque es más importante que el usuario llegue a su destino.
                    console.error('Error al incrementar visitas:', rpcError);
                }
                // --- FIN DE LA NUEVA LÓGICA ---

                // Hacemos la consulta para obtener la URL (lógica original)
                const { data, error } = await supabase
                    .from('qrs')
                    .select('url_activo')
                    .eq('id', USUARIO_ID)
                    .single();

                if (error || !data) {
                    console.error('Error o usuario no encontrado:', error);
                    document.body.innerHTML = '<p>Error: No se pudo encontrar el destino. Por favor, contacte al administrador.</p>';
                    return;
                }

                const destinoUrl = data.url_activo;
                if (destinoUrl) {
                    window.location.replace(destinoUrl);
                } else {
                    document.body.innerHTML = '<p>Error: El destino no está configurado.</p>';
                }

            } catch (err) {
                console.error('Error inesperado:', err);
                document.body.innerHTML = '<p>Ocurrió un error inesperado.</p>';
            }
        });
    </script>

</body>
</html>
